---
# Common base setup: install Docker Engine + compose v2 plugin.
#
# Targets Debian/Ubuntu hosts (the common VPS case). Add another family branch
# here if you run nodes on a different distribution.

- name: Fail clearly on unsupported distribution family
  ansible.builtin.fail:
    msg: >-
      This role currently supports Debian/Ubuntu only (got
      {{ ansible_os_family }}). Extend roles/common/tasks/main.yml to support it.
  when: ansible_os_family != "Debian"

- name: Ensure required base packages are installed
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true

- name: Create Docker apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: true

- name: Detect Debian architecture for Docker repo
  ansible.builtin.set_fact:
    docker_arch: >-
      {{ 'amd64' if ansible_architecture == 'x86_64'
         else 'arm64' if ansible_architecture == 'aarch64'
         else ansible_architecture }}

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} {{ docker_apt_channel }}
    state: present
    update_cache: true
    filename: docker

- name: Install Docker Engine and Compose v2 plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure Docker service is enabled and started
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Verify docker compose v2 is available
  ansible.builtin.command: docker compose version
  register: compose_version
  changed_when: false
