---
# Deploy node_exporter in a container, exposing host metrics to Prometheus.

- name: Ensure monitoring-agent directory exists
  ansible.builtin.file:
    path: "{{ monitoring_agent_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Template node_exporter docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_agent_dir }}/docker-compose.node_exporter.yml"
    mode: "0640"
  notify: restart node_exporter

- name: Apply node_exporter (docker compose up -d)
  ansible.builtin.command:
    cmd: docker compose -f {{ monitoring_agent_dir }}/docker-compose.node_exporter.yml up -d --remove-orphans
  register: node_exporter_up
  changed_when: >-
    'Started' in (node_exporter_up.stdout ~ node_exporter_up.stderr)
    or 'Recreated' in (node_exporter_up.stdout ~ node_exporter_up.stderr)
    or 'Created' in (node_exporter_up.stdout ~ node_exporter_up.stderr)
