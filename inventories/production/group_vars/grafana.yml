---
# Variables for the central Grafana/monitoring server.
#
# Secrets live in vault.yml (encrypted with ansible-vault) and are referenced
# here - never hardcode real passwords or tokens.

grafana_admin_user: admin
grafana_admin_password: "{{ vault_grafana_admin_password }}"

# Alertmanager -> Telegram integration (native telegram_configs receiver).
telegram_bot_token: "{{ vault_telegram_bot_token }}"
telegram_chat_id: "{{ vault_telegram_chat_id }}"

# --- Public HTTPS frontend (Caddy + Let's Encrypt) -------------------------
# Domain serving the Grafana UI over HTTPS. Point this domain's DNS A record
# at the grafana server, then set it here. Caddy obtains and renews the cert.
grafana_domain: monitoring.example.com

# Email used for Let's Encrypt certificate issuance and expiry notifications.
grafana_acme_email: you@example.com
