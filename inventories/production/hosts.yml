---
# Example inventory.
#
# Groups are fixed:  `grafana`  (central monitoring server)
#                    `nodes`   (monitored servers running Docker)
#
# These IPs are EXAMPLES only. Change them to match your own VPS hosts.
# Do not duplicate these addresses anywhere else - Prometheus targets and
# Loki endpoints are generated automatically from this file.

all:
  children:

    grafana:
      hosts:
        grafana01:
          ansible_host: 10.0.0.10

    nodes:
      # ansible_user is shared by all monitored nodes; override per-host if needed.
      vars:
        ansible_user: root
      hosts:
        node01:
          ansible_host: 10.0.0.11

        node02:
          ansible_host: 10.0.0.12

        node03:
          ansible_host: 10.0.0.13
